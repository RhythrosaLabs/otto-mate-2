app = "ottomate"
primary_region = "ewr"  # Newark — closest to Norwalk CT
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]

[env]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  DATABASE_PATH = "/data/ottomate.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "ottomate_data"
  destination = "/data"
